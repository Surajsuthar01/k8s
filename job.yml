apiVersion: batch/v1
kind: Job
metadata:
  name: demo-job
  namespace: suraj-nginx
spec:
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels:
        app: batch-task
    spec:
      containers:
      - name: batch-container
        image: busybox:latest
        command: ["sh", "-c", "echo Hello I'm Suraj Suthar && sleep 10"]
      restartPolicy: Never

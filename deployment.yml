kind: Deployment
apiVersion: apps/v1
metadata:
  name: nginx-deployment
  namespace: suraj-nginx
spec:
  replicas: 2
  selector:
   matchLabels:
     app: nginx
  template:
   metadata:
    name: nginx-dep-pod
    labels:
      app: nginx
   spec:
    containers:
    - name: nginx
      image: nginx
      ports:
      - containerPort: 80


